<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — autorekt</title>
<style>
  :root { --bg: #ffffff; --fg: #1d2330; --muted: #6b7385; --grid: #eef0f4; --up: #1a9e6f; --down: #d64545; --line: #3366cc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --fg: #e6e9ef; --muted: #8a93a6; --grid: #1f242d; --up: #2bbd85; --down: #f05a5a; --line: #6ea0ff; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; padding: 12px 16px 6px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .last { font-variant-numeric: tabular-nums; font-weight: 600; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .meta { color: var(--muted); font-size: 12px; }
  #chart { position: absolute; top: 56px; left: 0; right: 0; bottom: 22px; }
  footer { position: absolute; bottom: 0; left: 16px; right: 16px; height: 22px; color: var(--muted); font-size: 11px; }
  #err { color: var(--down); padding: 16px; display: none; }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <span class="last" id="last">…</span>
  <span class="chg" id="chg"></span>
  <span class="meta" id="meta"></span>
</header>
<div id="err"></div>
<div id="chart"></div>
<footer>autorekt — not financial advice; the name is a warning. Updates every 15s.</footer>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const el = document.getElementById('chart');
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: css('--bg') }, textColor: css('--fg') },
    grid: { vertLines: { color: css('--grid') }, horzLines: { color: css('--grid') } },
    timeScale: { timeVisible: true, secondsVisible: false },
    rightPriceScale: { borderVisible: false },
    crosshair: { mode: 0 },
  });
  let main = null, vol = null, overlays = {}, kind = null, first = true;
  const palette = ['#e39b2d', '#9b59b6', '#16a085', '#c0392b'];
  const t = (ms) => Math.floor(ms / 1000);
  function fmt(x) {
    if (x === null || x === undefined || !isFinite(x)) return '-';
    const a = Math.abs(x); const d = a >= 1e4 ? 0 : a >= 1e3 ? 1 : a >= 10 ? 2 : a >= 1 ? 4 : 6;
    return x.toFixed(d);
  }
  async function load() {
    try {
      const r = await fetch(location.pathname.replace(/\/$/, '') + '/data', { cache: 'no-store' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      document.getElementById('err').style.display = 'none';
      if (kind !== d.kind) {
        if (main) chart.removeSeries(main);
        kind = d.kind;
        main = kind === 'candles'
          ? chart.addCandlestickSeries({ upColor: css('--up'), downColor: css('--down'), wickUpColor: css('--up'), wickDownColor: css('--down'), borderVisible: false })
          : chart.addLineSeries({ color: css('--line'), lineWidth: 2 });
      }
      const bars = d.bars || [];
      if (kind === 'candles') {
        main.setData(bars.map(b => ({ time: t(b.timestamp), open: b.open, high: b.high, low: b.low, close: b.close })));
        if (bars.some(b => b.volume > 0)) {
          if (!vol) {
            vol = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
            chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
          }
          vol.setData(bars.map(b => ({ time: t(b.timestamp), value: b.volume, color: b.close >= b.open ? css('--up') + '55' : css('--down') + '55' })));
        }
      } else {
        main.setData(bars.map(b => ({ time: t(b.timestamp), value: b.close })));
      }
      (d.overlays || []).forEach((o, i) => {
        if (!overlays[o.id]) {
          const mx = Math.max(...o.bars.map(b => Math.abs(b.close)).filter(isFinite), 0);
          const prec = mx >= 100 ? 2 : mx >= 1 ? 4 : 6;
          overlays[o.id] = chart.addLineSeries({ color: palette[i % palette.length], lineWidth: 1, priceScaleId: 'ov' + i, title: o.id,
            priceFormat: { type: 'price', precision: prec, minMove: Math.pow(10, -prec) } });
          chart.priceScale('ov' + i).applyOptions({ scaleMargins: { top: 0.7, bottom: 0.12 } });
        }
        overlays[o.id].setData(o.bars.map(b => ({ time: t(b.timestamp), value: b.close })));
      });
      const marks = (d.markers || []).map(m => ({ time: t(m.t - (m.t % 60000)), position: 'aboveBar', color: '#e39b2d', shape: 'arrowDown', text: (m.text || '').slice(0, 40) }))
        .filter(m => bars.length && m.time >= t(bars[0].timestamp)).sort((a, b) => a.time - b.time);
      try { main.setMarkers(marks); } catch (e) {}
      if (bars.length) {
        const last = bars[bars.length - 1], base = bars[0].open || bars[0].close;
        document.getElementById('last').textContent = fmt(last.close);
        const c = (last.close / base - 1) * 100;
        const ce = document.getElementById('chg');
        ce.textContent = (c >= 0 ? '+' : '') + c.toFixed(2) + '% over view';
        ce.className = 'chg ' + (c >= 0 ? 'up' : 'down');
      }
      document.getElementById('meta').textContent = d.tf + ' · updated ' + new Date(d.updated).toLocaleTimeString();
      if (first) { chart.timeScale().fitContent(); first = false; }
    } catch (e) {
      const er = document.getElementById('err'); er.style.display = 'block'; er.textContent = 'Could not load data: ' + e.message;
    }
  }
  load(); setInterval(load, 15000);
})();
</script>
</body>
</html>
