[package]
name = "autorekt"
version = "0.1.0"
edition = "2021"
description = "Market observation for agents: quotes, candles, positioning, odds, news and watch rules — as a CLI any agent can use."
license = "MIT"
repository = "https://github.com/autorekt/autorekt"

[[bin]]
name = "autorekt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
libc = "0.2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
