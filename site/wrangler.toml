# autorekt.com: a static site served by Cloudflare Workers static assets, built from the READMEs,
# with the install scripts and the latest release's binaries. Deployed by .github/workflows/site.yml;
# by hand: put the release binaries in dist/, then `npx wrangler deploy` after `npx wrangler login`.
name = "autorekt-site"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "autorekt.com", custom_domain = true },
  { pattern = "www.autorekt.com", custom_domain = true },
]

[build]
command = "npm ci && node build.mjs"

[assets]
directory = "./public"
not_found_handling = "404-page"
